name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
      - name: Build zip
        run: zip -r "yt-adblocker-$GITHUB_REF_NAME.zip" manifest.json rules.json src icons LICENSE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "yt-adblocker-$GITHUB_REF_NAME.zip" --generate-notes
