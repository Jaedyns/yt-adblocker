name: Something broke
description: YouTube or the extension isn't working right.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How do we make it happen?
  - type: input
    id: browser
    attributes:
      label: Browser and extension version
