<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24">
    <h1>YT AdBlocker</h1>
    <label class="switch" title="Turn everything on or off">
      <input type="checkbox" data-key="enabled">
      <span></span>
    </label>
  </header>

  <section class="stats">
    <div><strong id="adsSkipped">0</strong><small>ads skipped</small></div>
    <div><strong id="adsStripped">0</strong><small>ads removed</small></div>
  </section>

  <section class="options">
    <label><input type="checkbox" data-key="strip"> Remove ads before they load</label>
    <label><input type="checkbox" data-key="skip"> Auto-skip ads that get through</label>
    <label><input type="checkbox" data-key="cosmetic"> Hide banner and feed ads</label>
  </section>

  <footer>
    <span id="version"></span>
    <a href="https://github.com/Jaedyns/yt-adblocker/issues/new/choose" target="_blank">Report an ad</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
